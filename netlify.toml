# tekkoh.com: a static page, no build.
[build]
  publish = "site"
  command = "echo 'static site, nothing to build'"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://tekkoh.cronbon.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "interest-cohort=(), camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/setup.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/dl/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# The link page reads the part after the #, which isn't sent; still, keep
# it out of caches and referrers.
[[headers]]
  for = "/link"
  [headers.values]
    Cache-Control = "no-store"
